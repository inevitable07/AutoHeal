# PATH= sudo nano /usr/local/nagios/etc/objects/webserver.cfg

define host {
    use                     linux-server
    host_name               webserver
    alias                   AutoHeal Web Server
    address                 AGENT_PRIVATE_IP
}

define service {
    use                     generic-service
    host_name               webserver
    service_description     HTTP
    check_command           check_http
}
